name: Deploy WMMNS

env:
  FTP_HOST: 153.92.11.53
  FTP_USERNAME: u308695494.bsit3a-pki.online
  FTP_PASSWORD: '@_Wmmns2024'
  DB_CON: mysql
  DB_USER: u308695494_wmmns
  DB_NAME: u308695494_wmmns
  DB_PASS: '@_Wmmns2024'

on:
  release:
    types: created

jobs:
  prepare-build:
    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: "8.2"

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Cache Composer packages
        uses: actions/cache@v2
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        run: |
            composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
            npm install

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Add database.sqlite
        run: touch database/database.sqlite

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          APP_ENV: testing
        run: php artisan migrate --force --no-interaction

      - name: Clear Laravel Cache and Configs
        run: |
          php artisan config:clear
          php artisan cache:clear

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: prepare-build

    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: "8.2"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Restore composer packages
        uses: actions/cache@v2
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Create .env File
        run: cp .env.example .env

      - name: Generate Laravel Key
        env:
            DB_CONNECTION: sqlite
            DB_DATABASE: database/database.sqlite
        run: |
          touch database/database.sqlite
          sleep 2
          php artisan key:generate

      - name: Build Vue
        run: |
            npm install
            npm run build

      - name: Remove node_module
        run: rm -rf node_modules

      - name: Update Database connection from .env
        run: |
          sed -i "s/DB_CONNECTION=.*/DB_CONNECTION=${DB_CON}/" .env
          sed -i "s/DB_DATABASE=.*/DB_DATABASE=${DB_NAME}/" .env
          sed -i "s/DB_USERNAME=.*/DB_USERNAME=${DB_USER}/" .env
          sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${DB_PASS}/" .env

      - name: Upload to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
            server: ${{ env.FTP_HOST }}
            username: ${{ env.FTP_USERNAME }}
            password: ${{ env.FTP_PASSWORD }}
            local-dir: ./
            exclude: |
                **/.git*
                **/.git*/**
                **/node_modules/**
                **/vendor/**

      - name: Install Composer Dependencies on Server
        run: |
          composer install --no-dev --optimize-autoloader
          